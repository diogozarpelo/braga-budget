{% extends "base.html" %}

{% block title %}Editar componente | Vidraçaria Braga{% endblock %}

{% block content %}
<section class="page-header">
    <div>
        <h2>Editar componente</h2>
        <p>Atualize o nome ou o valor unitário.</p>
    </div>

    <a class="button button-secondary" href="{{ url_for('main.components') }}">
        Voltar aos componentes
    </a>
</section>

<section class="card">
    {% if error %}
        <p class="alert alert-error">{{ error }}</p>
    {% endif %}

    <form method="post" class="form-grid">
        <label class="field">
            <span>Nome do componente *</span>
            <input
                type="text"
                name="name"
                value="{{ request.form.get('name', component['name']) }}"
                required
                autofocus
            >
        </label>

        <label class="field">
            <span>Valor unitário *</span>
            <input
                type="text"
                name="unit_price"
                value="{{ request.form.get('unit_price', '%.2f'|format(component['unit_price_cents'] / 100))|replace('.', ',') }}"
                inputmode="decimal"
                required
            >
        </label>

        <div class="form-actions field-full">
            <a class="button button-secondary" href="{{ url_for('main.components') }}">
                Cancelar
            </a>
            <button type="submit">Salvar alterações</button>
        </div>
    </form>
</section>
{% endblock %}
