<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vidraçaria Braga{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-content">
            <h1 class="topbar-brand">
                <a
                    class="topbar-home"
                    href="{{ url_for('main.index') }}"
                    aria-label="Voltar ao in?cio"
                    title="Voltar ao in?cio"
                >
                    <img
                        src="{{ url_for('static', filename='images/logo-semfundo-braga.png') }}"
                        alt="Vidra?aria Braga"
                        class="topbar-logo"
                    >
                </a>
            </h1>

            <nav class="topbar-nav" aria-label="Navegação principal">
                <a href="{{ url_for('main.clients') }}">Clientes</a>
                <a href="{{ url_for('main.quotes') }}">Orçamentos</a>
                <a href="{{ url_for('main.components') }}">Componentes</a>
                <a href="{{ url_for('main.settings') }}">Dados da vidraçaria</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="site-footer-content">
            <p>
                Desenvolvido por
                <a
                    href="https://github.com/diogozarpelo"
                    target="_blank"
                    rel="noopener noreferrer"
                >diogozarpelo</a>
            </p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
