<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vidraçaria Braga{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-content">
            <h1>
                <a
                    class="topbar-home"
                    href="{{ url_for('main.index') }}"
                    aria-label="Voltar ao início"
                    title="Voltar ao início"
                >
                    Vidraçaria Braga
                </a>
            </h1>

            <nav class="topbar-nav" aria-label="Navegação principal">
                <a href="{{ url_for('main.clients') }}">Clientes</a>
                <a href="{{ url_for('main.quotes') }}">Orçamentos</a>
                <a href="{{ url_for('main.settings') }}">Dados da vidraçaria</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
